name: Pages

# The site is built from data/ on every push to main rather than committed, so
# it cannot lag the paper list the way a checked-in artefact would. Nothing
# else needs to remember to rebuild it -- not the inbox automation, not a
# reviewer merging a hand-written PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should deploy the newest main, not fight the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A malformed record reaches the site the same way it reaches the README.
      - name: Validate data/papers.jsonl
        run: python3 scripts/validate.py

      - name: Build site
        run: python3 scripts/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
