name: Create PR from checked candidates

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pr:
    # Only on the inbox Issue, only from someone who can merge.
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'arxiv-candidates') &&
      startsWith(github.event.comment.body, '/create-pr') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Issue selections
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue view "$ISSUE_NUMBER" --json body --jq '.body' > "$RUNNER_TEMP/issue-body.md"

      - name: Apply checked candidates
        id: apply
        run: |
          count="$(python3 scripts/apply_issue_selections.py \
            --issue-body "$RUNNER_TEMP/issue-body.md" \
            --summary-output "$RUNNER_TEMP/pr-summary.md")"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Report empty selection
        if: steps.apply.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "Nothing new to apply. Tick a paper to accept it, or tick its \`drop\` box to stop it being proposed again, then comment \`/create-pr\`."

      - name: Regenerate and open pull request
        if: steps.apply.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 scripts/validate.py
          python3 scripts/build_readme.py

          branch="automation/arxiv-candidates-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # Both verdicts travel together: the accepted papers and the crossed-out
          # ones are one review, and recording half of it would leave the other
          # half in an Issue body that tomorrow's refresh overwrites.
          git add data/papers.jsonl data/maintainer-rejected.jsonl \
                  README.md docs/comparison.md
          git commit -m "Apply inbox review"
          git push origin "$branch"

          {
            printf 'Generated from candidate inbox #%s.\n\n' "$ISSUE_NUMBER"
            cat "$RUNNER_TEMP/pr-summary.md"
          } > "$RUNNER_TEMP/pr-body.md"
          pr_url="$(gh pr create \
            --base "$DEFAULT_BRANCH" --head "$branch" \
            --title "Apply inbox review" \
            --label arxiv-candidates \
            --body-file "$RUNNER_TEMP/pr-body.md")"
          gh issue close "$ISSUE_NUMBER" \
            --comment "Created $pr_url from the reviewed candidates. Anything left unmarked returns in the next inbox refresh, whether or not it is still inside the search window."
