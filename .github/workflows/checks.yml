name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate data/papers.jsonl
        run: python3 scripts/validate.py

      - name: README is up to date with the data
        run: |
          python3 scripts/build_readme.py --check || {
            echo "::error::README.md or docs/comparison.md is stale."
            echo "::error::Edit data/papers.jsonl, then run: python3 scripts/build_readme.py"
            exit 1
          }

      # The site is not committed, so nothing else would notice a template or a
      # generator broken by this PR until the deploy failed on main.
      - name: Site builds
        run: python3 scripts/build_site.py --check

      - name: Unit tests
        run: python3 -m unittest discover -s tests
