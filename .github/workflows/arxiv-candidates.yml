name: Refresh candidate inbox

# The daily half of recall: arXiv, which is date-windowed, and the blog
# watchlist, whose feeds are incremental for free. OpenReview and the
# conference proceedings cannot be windowed by date, so they are swept on
# demand from a machine that can run the review agent:
#   python3 scripts/agent_review.py --openreview
#   python3 scripts/agent_review.py --venue CVPR2025

on:
  # 03:43 in Asia/Shanghai, which is where this list is read: the inbox is
  # waiting at the start of the day rather than landing in the middle of it.
  #
  # Still neither on the hour nor on the half -- the runner pool queues deepest
  # there, and the old 01:30 slot routinely started 30-45 minutes late. The
  # 04:17 slot that replaced it was chosen to sit clear of arXiv's 00:00 UTC
  # announcement and did not help: four consecutive runs died on a 429 across
  # 09-13..09-15. The fallback in arxiv_candidates.py is the actual answer to
  # that; this hour is about when the report is useful.
  #
  # The cost is one announcement cycle of latency. arXiv announces at 00:00 UTC
  # -- 08:00 in Shanghai -- so no hour that counts as early morning there can
  # see the same day's batch, and each paper is proposed a day later than it
  # could be. The window is seven days wide, so nothing is missed by it.
  schedule:
    - cron: "43 19 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Number of days to search
        required: false
        default: "7"
      blog_days:
        description: How far back to look on the blog watchlist
        required: false
        default: "30"

permissions:
  contents: read
  issues: write
  # Only to ask when this workflow last succeeded, which is what the search
  # window is anchored to.
  actions: read

jobs:
  refresh-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare inbox state
        id: inbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create arxiv-candidates \
            --description "Automatically discovered arXiv papers awaiting review" \
            --color "0E8A16" \
            --force
          issue_number="$(gh issue list \
            --label arxiv-candidates --state open --limit 1 \
            --json number --jq '.[0].number')"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          # There is usually an open inbox. When there is not, it is because
          # /create-pr closed it on the way to recording a review -- and the
          # papers nobody ticked went down with it, still unjudged. The scripts carry
          # unjudged candidates across a moving window, but only if they are
          # handed the previous body, so read the closed one rather than
          # starting empty: any finite window means "starting empty" loses every
          # candidate older than it, the day after any review is recorded.
          if [ -n "$issue_number" ]; then
            gh issue view "$issue_number" --json body --jq '.body' > "$RUNNER_TEMP/existing-inbox.md"
          else
            closed="$(gh issue list \
              --label arxiv-candidates --state closed --limit 5 \
              --json number,body,updatedAt --jq 'max_by(.updatedAt) // {}')"
            jq -r '.body // ""' <<<"$closed" > "$RUNNER_TEMP/existing-inbox.md"
            # Where to say "nothing today" when there is no open inbox to put
            # it in -- see the last branch of `Update review inbox`.
            echo "closed_issue_number=$(jq -r '.number // ""' <<<"$closed")" \
              >> "$GITHUB_OUTPUT"
          fi
          # How far back this run has to reach. A window of `now - days` only
          # covers the gap between runs while the runs actually happen: a run
          # that died searched nothing, and the next one opens its window after
          # the gap it was supposed to close. 08-11, 08-12 and 08-13 all died on
          # a 429, and the 08-14 run opened at 08-11 02:17 -- 2h15m after
          # 2608.14706 was submitted, which no later window can ever reach back
          # for, because every later window opens later still. So anchor to the
          # last run that finished instead. This one is still in_progress, so it
          # cannot match itself; an empty answer means nothing has ever
          # succeeded, and the script falls back to the plain window.
          since="$(gh run list \
            --workflow "$GITHUB_WORKFLOW" --status success --limit 1 \
            --json createdAt --jq '.[0].createdAt // ""')"
          echo "since=$since" >> "$GITHUB_OUTPUT"

      - name: Generate candidate report
        id: candidates
        env:
          # Seven days, not three. Covering the gap between runs is `--since`'s
          # job now; what the window is for is arXiv's announcement lag, which
          # routinely runs to two or three days -- 2608.14706 carries
          # submittedDate 08-11 and an id from the 08-13 announcement batch.
          SEARCH_DAYS: ${{ github.event.inputs.days || '7' }}
          BLOG_DAYS: ${{ github.event.inputs.blog_days || '30' }}
          SINCE: ${{ steps.inbox.outputs.since }}
        run: |
          arxiv="$(python3 scripts/arxiv_candidates.py \
            --days "$SEARCH_DAYS" \
            --since "$SINCE" \
            --existing-issue-body "$RUNNER_TEMP/existing-inbox.md" \
            --output "$RUNNER_TEMP/arxiv-candidates.md")"
          # A watchlist source being down must not cost the day's arXiv report,
          # so the blog step is allowed to fail into an empty block.
          blog=0
          if python3 scripts/blog_candidates.py \
            --days "$BLOG_DAYS" \
            --existing-issue-body "$RUNNER_TEMP/existing-inbox.md" \
            --output "$RUNNER_TEMP/blog-candidates.md" > "$RUNNER_TEMP/blog-count"; then
            blog="$(cat "$RUNNER_TEMP/blog-count")"
          else
            echo "::warning::the blog watchlist failed; the inbox has arXiv only"
            : > "$RUNNER_TEMP/blog-candidates.md"
          fi
          cat "$RUNNER_TEMP/arxiv-candidates.md" > "$RUNNER_TEMP/inbox.md"
          if [ "$blog" -gt 0 ]; then
            printf '\n---\n\n' >> "$RUNNER_TEMP/inbox.md"
            cat "$RUNNER_TEMP/blog-candidates.md" >> "$RUNNER_TEMP/inbox.md"
          fi
          echo "count=$((arxiv + blog))" >> "$GITHUB_OUTPUT"
          # A run that reports nothing still has to be readable as a run. The
          # header of the report is the only place that knows whether the window
          # was searched or merely stood in for.
          {
            printf '### Candidate sweep\n\n'
            printf -- '- arXiv: **%s**\n' "$arxiv"
            printf -- '- watchlist: **%s**\n' "$blog"
            if grep -q "date window was not searched" "$RUNNER_TEMP/inbox.md"; then
              printf -- '- the date window was **not** searched: this is one '
              printf -- 'day of announcements, and the window comes back to the '
              printf -- 'next run that reaches a host\n'
            else
              printf -- '- the date window was searched\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update review inbox
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COUNT: ${{ steps.candidates.outputs.count }}
          ISSUE_NUMBER: ${{ steps.inbox.outputs.issue_number }}
          CLOSED_ISSUE_NUMBER: ${{ steps.inbox.outputs.closed_issue_number }}
        run: |
          if [ "$CANDIDATE_COUNT" -gt 0 ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue edit "$ISSUE_NUMBER" \
                --title "Review recent candidates" \
                --body-file "$RUNNER_TEMP/inbox.md"
            else
              gh issue create \
                --title "Review recent candidates" \
                --label arxiv-candidates \
                --body-file "$RUNNER_TEMP/inbox.md"
            fi
          elif [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" \
              --comment "No unreviewed candidates remain in the current search window."
          elif [ -n "$CLOSED_ISSUE_NUMBER" ]; then
            # Nothing to review, and no open inbox to close either -- which is
            # the one path that used to end the run without saying anything
            # anywhere a maintainer looks. On 09-18 that was reported as a
            # failure: it was a healthy run whose honest answer was "nothing",
            # and from the outside silence is indistinguishable from the 406
            # that really did kill 09-16. So it speaks on the inbox it last
            # read, where whoever reviewed it is already subscribed.
            if grep -q "date window was not searched" "$RUNNER_TEMP/inbox.md"; then
              why="arXiv's API and OAI-PMH both refused the window, so this run"
              why="$why could only see one day of announcements -- and it held"
              why="$why nothing that is not already recorded. The window itself"
              why="$why is still unsearched, and comes back to the next run"
              why="$why that reaches a host."
            else
              why="The window was searched and held nothing this list does not"
              why="$why already have."
            fi
            gh issue comment "$CLOSED_ISSUE_NUMBER" \
              --body "This sweep found no unreviewed candidates. $why"
          fi
