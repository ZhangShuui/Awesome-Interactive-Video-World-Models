name: Refresh candidate inbox

# The daily half of recall: arXiv, which is date-windowed, and the blog
# watchlist, whose feeds are incremental for free. OpenReview and the
# conference proceedings cannot be windowed by date, so they are swept on
# demand from a machine that can run the review agent:
#   python3 scripts/agent_review.py --openreview
#   python3 scripts/agent_review.py --venue CVPR2025

on:
  # Neither on the hour nor on the half, and well clear of arXiv's 00:00 UTC
  # announcement. The old 01:30 slot was the worst of both: the runner pool
  # queues deepest there, so the job actually started 30-45 minutes late, and
  # it landed while everything else was still scraping the new listing. Three
  # of the last four scheduled runs died on a 429 before reaching the inbox.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Number of days to search
        required: false
        default: "3"
      blog_days:
        description: How far back to look on the blog watchlist
        required: false
        default: "30"

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  refresh-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare inbox state
        id: inbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create arxiv-candidates \
            --description "Automatically discovered arXiv papers awaiting review" \
            --color "0E8A16" \
            --force
          issue_number="$(gh issue list \
            --label arxiv-candidates --state open --limit 1 \
            --json number --jq '.[0].number')"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          # There is usually an open inbox. When there is not, it is because
          # /create-pr closed it on the way to a pull request -- and the papers
          # nobody ticked went down with it, still unjudged. The scripts carry
          # unjudged candidates across a moving window, but only if they are
          # handed the previous body, so read the closed one rather than
          # starting empty: a 3-day window means "starting empty" loses every
          # candidate older than yesterday, the day after any PR is opened.
          if [ -n "$issue_number" ]; then
            gh issue view "$issue_number" --json body --jq '.body' > "$RUNNER_TEMP/existing-inbox.md"
          else
            gh issue list \
              --label arxiv-candidates --state closed --limit 5 \
              --json body,updatedAt --jq 'max_by(.updatedAt).body // ""' \
              > "$RUNNER_TEMP/existing-inbox.md"
          fi
          # Papers already sitting in an open pipeline PR must not be re-proposed.
          gh pr list \
            --label arxiv-candidates --state open --limit 100 \
            --json body --jq '.[].body' > "$RUNNER_TEMP/open-arxiv-prs.md"

      - name: Generate candidate report
        id: candidates
        env:
          SEARCH_DAYS: ${{ github.event.inputs.days || '3' }}
          BLOG_DAYS: ${{ github.event.inputs.blog_days || '30' }}
        run: |
          arxiv="$(python3 scripts/arxiv_candidates.py \
            --days "$SEARCH_DAYS" \
            --existing-issue-body "$RUNNER_TEMP/existing-inbox.md" \
            --known-file "$RUNNER_TEMP/open-arxiv-prs.md" \
            --output "$RUNNER_TEMP/arxiv-candidates.md")"
          # A watchlist source being down must not cost the day's arXiv report,
          # so the blog step is allowed to fail into an empty section.
          blog=0
          if python3 scripts/blog_candidates.py \
            --days "$BLOG_DAYS" \
            --existing-issue-body "$RUNNER_TEMP/existing-inbox.md" \
            --output "$RUNNER_TEMP/blog-candidates.md" > "$RUNNER_TEMP/blog-count"; then
            blog="$(cat "$RUNNER_TEMP/blog-count")"
          else
            echo "::warning::the blog watchlist failed; the inbox has arXiv only"
            : > "$RUNNER_TEMP/blog-candidates.md"
          fi
          cat "$RUNNER_TEMP/arxiv-candidates.md" > "$RUNNER_TEMP/inbox.md"
          if [ "$blog" -gt 0 ]; then
            printf '\n---\n\n' >> "$RUNNER_TEMP/inbox.md"
            cat "$RUNNER_TEMP/blog-candidates.md" >> "$RUNNER_TEMP/inbox.md"
          fi
          echo "count=$((arxiv + blog))" >> "$GITHUB_OUTPUT"

      - name: Update review inbox
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COUNT: ${{ steps.candidates.outputs.count }}
          ISSUE_NUMBER: ${{ steps.inbox.outputs.issue_number }}
        run: |
          if [ "$CANDIDATE_COUNT" -gt 0 ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue edit "$ISSUE_NUMBER" \
                --title "Review recent candidates" \
                --body-file "$RUNNER_TEMP/inbox.md"
            else
              gh issue create \
                --title "Review recent candidates" \
                --label arxiv-candidates \
                --body-file "$RUNNER_TEMP/inbox.md"
            fi
          elif [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" \
              --comment "No unreviewed candidates remain in the current search window."
          fi
